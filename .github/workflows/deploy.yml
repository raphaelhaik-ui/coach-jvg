name: Déploiement du site

# Se déclenche à chaque enregistrement sur la branche principale,
# ou manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits nécessaires pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer les fichiers publics du site
        # On ne publie que le site lui-même (pas le brief ni les notes internes)
        run: |
          mkdir -p _site
          cp index.html styles.css script.js _site/
          cp -r assets _site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publier en ligne
        id: deployment
        uses: actions/deploy-pages@v4
